<svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fluxGoldGrad" x1="4" y1="4" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="45%" stop-color="#F5BE38"/>
      <stop offset="100%" stop-color="#D99818"/>
    </linearGradient>
    <filter id="fluxGoldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer glowing hexagon -->
  <polygon points="22,3 39,12.5 39,31.5 22,41 5,31.5 5,12.5" stroke="url(#fluxGoldGrad)" stroke-width="3" stroke-linejoin="round" fill="rgba(245, 190, 56, 0.05)" filter="url(#fluxGoldGlow)"/>
  <!-- Inner Isometric Cube geometry -->
  <!-- Top Face -->
  <polygon points="22,11 31,16.5 22,22 13,16.5" fill="rgba(255, 232, 133, 0.25)" stroke="url(#fluxGoldGrad)" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="13,16.5 22,22 22,33 13,27.5" fill="rgba(217, 152, 24, 0.15)" stroke="url(#fluxGoldGrad)" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="22,22 31,16.5 31,27.5 22,33" fill="rgba(245, 190, 56, 0.3)" stroke="url(#fluxGoldGrad)" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
